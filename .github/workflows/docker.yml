name: Create and publish a Docker image

on:
  push:
    branches: ['main']
    tags: ['v*']

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/code-quality.yml
    secrets: inherit
  
  test:
    uses: ./.github/workflows/test.yml
    secrets: inherit

  build-and-push-image:
    needs: [quality, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # The secrets are used for login only; the image name is hardcoded below.
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: techblog/openwa_llm
          # main pushes publish :latest; v* tags publish :latest and :<version> (no "v").
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Note: If your Dockerfile requires secrets (like .netrc), you need to pass them here.
          # For example:
          # secrets: |
          #   "netrc=${{ secrets.NETRC }}"
