<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <script>
      /* Set the theme class before first paint (mirrors src/lib/theme.ts). */
      (function () {
        var m = null;
        try { m = localStorage.getItem("admin-theme"); } catch (e) {}
        var dark = m === "dark" || (m !== "light" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
        var r = document.documentElement;
        r.classList.toggle("dark", dark);
        r.setAttribute("data-theme", dark ? "dark" : "light");
      })();
    </script>
    <title>WhatsApp Bot Admin</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
