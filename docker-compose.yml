services:
  postgres:
    extends:
      file: docker-compose.base.yml
      service: postgres

  whatsapp:
    extends:
      file: docker-compose.base.yml
      service: whatsapp

  web-server:
    image: techblog/openwa_llm:latest
    pull_policy: always
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - whatsapp
    environment:
      - PORT=8000
      - DB_URI=postgresql+asyncpg://user:password@postgres:5432/postgres
      - WHATSAPP_HOST=http://whatsapp:2785
      - OPENWA_WEBHOOK_URL=http://web-server:8000/webhook

volumes:
  wa_llm_openwa:
    name: wa_llm_openwa
  wa_llm_postgres:
    name: wa_llm_postgres